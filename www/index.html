<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Launcher iOS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="locked st-normal">

  <div id="wall" class="defwall"></div>
  <div id="wallShade"></div>

  <div id="home">
    <div id="editbar">
      <button id="eSet" class="gl pill">ตั้งค่า</button>
      <button id="eDone" class="gl pill">ตกลง</button>
    </div>
    <div id="pages"></div>
    <div id="dots"></div>
    <div id="dock" class="gl"></div>
  </div>

  <div id="defBanner" class="gl">
    <span>ตั้งเป็นแอป Home เริ่มต้นใช่ไหม?</span>
    <div><button id="defYes">เปิดใช้งาน</button><button id="defNo">ไว้ทีหลัง</button></div>
  </div>

  <div id="folder">
    <div id="folderPanel" class="gl">
      <input id="folderName" maxlength="24" autocomplete="off">
      <div id="folderGrid"></div>
    </div>
  </div>

  <div id="spot">
    <div id="spotBox">
      <div class="gl spotbar"><span>🔍</span><input id="spotIn" placeholder="ค้นหา" autocomplete="off"><button id="spotX">ยกเลิก</button></div>
      <div id="spotRes" class="gl"></div>
    </div>
  </div>

  <div id="menuBack"><div id="menu" class="gl"></div></div>

  <div id="sheet">
    <div id="sheetPanel" class="gl">
      <div class="sh-head"><b>ตั้งค่าแอป Launcher</b><button id="shX">ปิด</button></div>
      <div class="sh-row"><label>รูปแบบไอคอน</label>
        <div class="seg" id="sgStyle"><button data-v="normal">ปกติ</button><button data-v="dark">มืด</button><button data-v="tint">ปรับสี</button><button data-v="clear">สว่าง</button></div>
      </div>
      <div class="sh-row" id="hueRow"><label>โทนสี</label><input type="range" id="rHue" min="0" max="360"></div>
      <div class="sh-row"><label>วิดเจ็ต</label>
        <div class="seg" id="sgWid"><button data-v="none">ไม่มี</button><button data-v="duo">วันที่ + แบตเตอรี่</button><button data-v="notes">โน้ต</button></div>
      </div>
      <div class="sh-row inline"><label>แสดง % ในแบตเตอรี่</label><button class="tg" id="tgPct"></button></div>
      <div class="sh-row inline"><label>หน้าล็อกตอนเปิดเครื่อง</label><button class="tg" id="tgLockStart"></button></div>
      <div class="sh-row inline"><label>หน้าล็อกตอนปิดหน้าจอ</label><button class="tg" id="tgLockOff"></button></div>
      <div class="sh-row inline"><label>แถบสถานะของฉัน (ซ่อนของระบบ)</label><button class="tg" id="tgOwnBar"></button></div>
      <div class="sh-row"><button id="shWall" class="wide">เปลี่ยนวอลเปเปอร์</button></div>
      <div class="sh-row"><button id="shHome" class="wide">ตั้งเป็นแอป Home เริ่มต้น</button></div>
    </div>
  </div>

  <div id="lock">
    <div id="lkBg" class="defwall"></div>
    <div id="lkShade"></div>
    <div id="lkDate"></div>
    <div id="lkClock">
      <div id="ckIn" data-s="glass"><div id="ck1"></div><div id="ck2"></div></div>
    </div>
    <div id="ckFrame"><i id="ckHandle"></i></div>
    <div id="lkSubj"></div>
    <div id="lkBtns">
      <button id="bTorch" class="gl round">🔦</button>
      <button id="bCam" class="gl round">📷</button>
    </div>
    <div id="lkHint"><span>ปัดขึ้นเพื่อเปิด</span><i></i></div>
    <div id="pickBanner">แตะวัตถุที่ต้องการตัดภาพ</div>
    <div id="lkPanel" class="gl">
      <div class="swatches" id="ckStyles">
        <button data-v="glass" style="background:linear-gradient(#ffffffd9,#ffffff55)"></button>
        <button data-v="white" style="background:#fff"></button>
        <button data-v="gold" style="background:linear-gradient(#ffe29a,#ff9f45)"></button>
        <button data-v="ice" style="background:linear-gradient(#e6f6ff,#6ec1ff)"></button>
        <button data-v="red" style="background:linear-gradient(#ffb3b3,#ff3b30)"></button>
      </div>
      <div class="lk-row"><label>ความกว้าง</label><input type="range" id="rW" min="25" max="95"></div>
      <div class="lk-row"><label>ความสูง</label><input type="range" id="rH" min="100" max="420"></div>
      <div class="lk-row two"><button id="bMode">สไตล์</button><button id="bDepth">ความลึก</button></div>
      <div class="lk-row two"><button id="bWall">เปลี่ยนพื้นหลัง</button><button id="bCut">ตัดภาพ</button></div>
      <div class="lk-row two"><button id="bImp">นำเข้า PNG</button><button id="bClr">ลบการตัดภาพ</button></div>
      <div class="lk-row two"><button id="bDone" class="primary">เสร็จ</button></div>
    </div>
  </div>

  <div id="status">
    <span id="sbTime"></span>
    <span id="sbR">
      <span id="sbNet"></span>
      <span id="sbBolt">⚡</span>
      <span class="batw"><span id="sbBat" class="bat"><i class="fill"></i><b></b></span></span>
    </span>
  </div>

  <div id="toast"></div>
</div>

<input type="file" id="fWall" accept="image/*" hidden>
<input type="file" id="fCut" accept="image/png" hidden>
<script src="script.js"></script>
</body>
</html>
